name: Axly DSA Tracker CD

on:
  workflow_run:
    workflows: ["Axly DSA Tracker CI"]
    types: [completed]

env:
  NODE_VERSION: 22

defaults:
  run:
    shell: bash

# CD is strictly ordered:
# 1. CI must be successful (workflow_run trigger + job condition)
# 2. Deploy backend to Heroku
# 3. Wait for the Vercel deployment result for the exact tested commit
# 4. Run production smoke tests against the deployed stack
permissions:
  contents: read
  checks: read
  statuses: read

# Prevent overlapping production deployments on the same branch. We deliberately
# do not cancel an in-flight deployment because a partial Heroku deploy must not
# be interrupted by a newer run.
concurrency:
  group: axly-dsa-cd-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy Backend to Heroku
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Heroku Configuration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "HEROKU_API_KEY is not configured"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "HEROKU_APP_NAME is not configured"; exit 1; }
          echo "Heroku app configured: $HEROKU_APP_NAME"

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git remote remove heroku 2>/dev/null || true
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          # Heroku's main branch has independent deployment history. Force-push so
          # the app exactly matches the CI-tested GitHub commit.
          git push heroku HEAD:main --force

  vercel-gate:
    name: Vercel CD Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Wait for Vercel Deployment Result
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Waiting for a successful Vercel result on $TESTED_SHA"
          # Vercel has been observed on this repository using the Commit Status API
          # (context: Vercel), so check both Status and Checks APIs for compatibility.
          # 60 x 15s = 15 minutes maximum wait.
          for attempt in {1..60}; do
            STATUSES="$(gh api --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/status")"

            CHECKS="$(gh api --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/check-runs?per_page=100")"

            VERCEL_STATUS="$(printf '%s' "$STATUSES" | jq -r '
              [.statuses[]
                | select((.context // "" | ascii_downcase | contains("vercel")))
                | .state
              ]
              | if length == 0 then "missing"
                else .[0]
                end
            ')"

            VERCEL_CHECK="$(printf '%s' "$CHECKS" | jq -r '
              [.check_runs[]
                | select((.app.slug // "" | ascii_downcase) == "vercel"
                  or (.name // "" | ascii_downcase | startswith("vercel")))
                | {status, conclusion, name}
              ]
              | if length == 0 then "missing"
                else (map(select(.status == "completed")) | last // .[0])
                end
              | if type == "string" then . else (.status + ":" + (.conclusion // "")) end
            ')"

            echo "Vercel commit status: $VERCEL_STATUS"
            echo "Vercel check: $VERCEL_CHECK"

            # Success from either GitHub integration mechanism is sufficient.
            if [[ "$VERCEL_STATUS" == "success" || "$VERCEL_CHECK" == "completed:success" ]]; then
              echo "Vercel gate passed."
              exit 0
            fi

            # Fail fast when Vercel explicitly reports a terminal failure.
            if [[ "$VERCEL_STATUS" == "failure" || "$VERCEL_STATUS" == "error" ]]; then
              echo "Vercel gate failed: commit status=$VERCEL_STATUS"
              exit 1
            fi

            if [[ "$VERCEL_CHECK" == "completed:failure" || "$VERCEL_CHECK" == "completed:cancelled" || "$VERCEL_CHECK" == "completed:timed_out" || "$VERCEL_CHECK" == "completed:error" ]]; then
              echo "Vercel gate failed: check=$VERCEL_CHECK"
              exit 1
            fi

            echo "Vercel result is not successful yet; waiting 15 seconds..."
            sleep 15
          done

          echo "Timed out waiting for the Vercel deployment result after 15 minutes."
          exit 1

  production-smoke:
    name: Production Smoke Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    needs: vercel-gate
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Production Smoke Tests
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL" || { echo "PRODUCTION_BASE_URL is not configured"; exit 1; }
          test -n "$PRODUCTION_API_URL" || { echo "PRODUCTION_API_URL is not configured"; exit 1; }
          npx playwright test --config=playwright.production.config.js tests/e2e/production-smoke.spec.js --reporter=list
