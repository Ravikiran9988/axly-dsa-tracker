name: Axly DSA Tracker CD

on:
  workflow_run:
    workflows: ["Axly DSA Tracker CI"]
    types: [completed]

env:
  NODE_VERSION: 22

defaults:
  run:
    shell: bash

# Production deployment is gated by successful CI on main and a successful
# Vercel check for the exact tested commit. Vercel is a gate only; the actual
# production deployment performed by this workflow is the Heroku backend.
permissions:
  contents: read
  checks: read

jobs:
  vercel-gate:
    name: Vercel CD Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel Check
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Waiting for a successful Vercel check on $TESTED_SHA"
          for attempt in {1..40}; do
            CHECKS="$(gh api --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${TESTED_SHA}/check-runs?per_page=100")"

            VERCEL_STATUS="$(printf '%s' "$CHECKS" | jq -r '
              [.check_runs[]
                | select((.app.slug // "" | ascii_downcase) == "vercel"
                  or (.name // "" | ascii_downcase | startswith("vercel")))
                | {status, conclusion, name}
              ]
              | if length == 0 then "missing"
                else (map(select(.status == "completed")) | last // .[0])
                end
              | if type == "string" then . else (.status + ":" + (.conclusion // "")) end
            ')

            echo "Vercel check: $VERCEL_STATUS"

            if [[ "$VERCEL_STATUS" == "completed:success" ]]; then
              echo "Vercel gate passed."
              exit 0
            fi

            if [[ "$VERCEL_STATUS" == "completed:failure" || "$VERCEL_STATUS" == "completed:cancelled" || "$VERCEL_STATUS" == "completed:timed_out" ]]; then
              echo "Vercel gate failed: $VERCEL_STATUS"
              exit 1
            fi

            if [[ "$VERCEL_STATUS" == "completed:error" ]]; then
              echo "Vercel gate failed: $VERCEL_STATUS"
              exit 1
            fi

            echo "Vercel check is not successful yet; waiting 15 seconds..."
            sleep 15
          done

          echo "Timed out waiting for the Vercel check."
          exit 1

  deploy-backend:
    name: Deploy Backend to Heroku
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    needs: vercel-gate
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify Heroku Configuration
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          test -n "$HEROKU_API_KEY" || { echo "HEROKU_API_KEY is not configured"; exit 1; }
          test -n "$HEROKU_APP_NAME" || { echo "HEROKU_APP_NAME is not configured"; exit 1; }
          echo "Heroku app configured: $HEROKU_APP_NAME"

      - name: Deploy Backend to Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
        run: |
          git remote remove heroku 2>/dev/null || true
          git remote add heroku "https://heroku:${HEROKU_API_KEY}@git.heroku.com/${HEROKU_APP_NAME}.git"
          # Heroku's main branch has independent deployment history. Force-push so
          # the app exactly matches the CI-tested GitHub commit.
          git push heroku HEAD:main --force

  production-smoke:
    name: Production Smoke Tests
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout Tested Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Production Smoke Tests
        env:
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL" || { echo "PRODUCTION_BASE_URL is not configured"; exit 1; }
          test -n "$PRODUCTION_API_URL" || { echo "PRODUCTION_API_URL is not configured"; exit 1; }
          npx playwright test --config=playwright.production.config.js tests/e2e/production-smoke.spec.js --reporter=list
