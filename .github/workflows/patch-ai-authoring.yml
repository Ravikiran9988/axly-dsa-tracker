name: Wire AI Daily Challenge Authoring Controls

on:
  push:
    paths:
      - '.github/workflows/patch-ai-authoring.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Daily Challenge modal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/components/AdminDailyChallengeModal.jsx')
          text = path.read_text()

          state_marker = "  const [recReason, setRecReason] = useState('');\n"
          state_insert = state_marker + "  const [aiTestCaseLoading, setAiTestCaseLoading] = useState(false);\n  const [aiHintLoading, setAiHintLoading] = useState(false);\n"
          if "aiTestCaseLoading" not in text:
              text = text.replace(state_marker, state_insert, 1)

          handler_marker = "  const groupedTopics = useMemo(() => {"
          handlers = r'''  const buildAiAuthoringPayload = () => ({
    ...formData,
    topic: formData.topic_name || '',
    pattern: formData.pattern_name || ''
  });

  const handleGenerateAiTestCases = async () => {
    if (!formData.title.trim() || !formData.description.trim()) {
      setError('Enter the challenge title and problem statement before generating test cases.');
      return;
    }
    setAiTestCaseLoading(true);
    setError(null);
    try {
      const res = await api.generateDailyChallengeTestCases(buildAiAuthoringPayload());
      const generated = res?.data?.test_cases;
      if (!Array.isArray(generated) || generated.length !== 4) throw new Error('AI did not return 4 verified test cases.');
      setFormData(prev => ({
        ...prev,
        test_cases: generated.map((tc, idx) => ({
          id: `ai-tc-${Date.now()}-${idx}`,
          input: tc.input,
          expected_output: tc.expected_output,
          is_hidden: Boolean(tc.is_hidden)
        }))
      }));
    } catch (err) {
      setError(err.message || 'AI test case generation failed.');
    } finally {
      setAiTestCaseLoading(false);
    }
  };

  const handleGenerateAiHints = async () => {
    if (!formData.title.trim() || !formData.description.trim()) {
      setError('Enter the challenge title and problem statement before generating hints.');
      return;
    }
    setAiHintLoading(true);
    setError(null);
    try {
      const res = await api.generateDailyChallengeHints(buildAiAuthoringPayload());
      const generated = res?.data?.hints;
      if (!Array.isArray(generated) || generated.length !== 3) throw new Error('AI did not return 3 progressive hints.');
      setFormData(prev => ({ ...prev, hints: generated }));
    } catch (err) {
      setError(err.message || 'AI hint generation failed.');
    } finally {
      setAiHintLoading(false);
    }
  };

'''
          if "handleGenerateAiTestCases" not in text:
              text = text.replace(handler_marker, handlers + handler_marker, 1)

          test_header = '''                    <button
                      type="button"
                      onClick={addTestCase}
                      className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1"
                    >
                      <Plus className="w-3 h-3" /> Add Test Case
                    </button>'''
          test_replacement = '''                    <div className="flex items-center gap-2">
                      <button
                        type="button"
                        onClick={handleGenerateAiTestCases}
                        disabled={aiTestCaseLoading}
                        className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1 border-indigo-500/40 text-indigo-300 hover:text-indigo-200"
                      >
                        {aiTestCaseLoading ? <RefreshCw className="w-3 h-3 animate-spin" /> : <Sparkles className="w-3 h-3 text-amber-400" />}
                        {aiTestCaseLoading ? 'Generating...' : 'AI Generate Test Cases'}
                      </button>
                      <button
                        type="button"
                        onClick={addTestCase}
                        className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1"
                      >
                        <Plus className="w-3 h-3" /> Add Test Case
                      </button>
                    </div>'''
          if "AI Generate Test Cases" not in text:
              if test_header not in text:
                  raise SystemExit('Test case toolbar marker not found')
              text = text.replace(test_header, test_replacement, 1)

          hint_header = '''                      <button
                        type="button"
                        onClick={addHint}
                        className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1"
                      >
                        <Plus className="w-3 h-3" /> Add Hint
                      </button>'''
          hint_replacement = '''                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={handleGenerateAiHints}
                          disabled={aiHintLoading}
                          className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1 border-indigo-500/40 text-indigo-300 hover:text-indigo-200"
                        >
                          {aiHintLoading ? <RefreshCw className="w-3 h-3 animate-spin" /> : <Sparkles className="w-3 h-3 text-amber-400" />}
                          {aiHintLoading ? 'Generating...' : 'AI Generate Hints'}
                        </button>
                        <button
                          type="button"
                          onClick={addHint}
                          className="btn-secondary btn-sm text-[11px] inline-flex items-center gap-1"
                        >
                          <Plus className="w-3 h-3" /> Add Hint
                        </button>
                      </div>'''
          if "AI Generate Hints" not in text:
              if hint_header not in text:
                  raise SystemExit('Hint toolbar marker not found')
              text = text.replace(hint_header, hint_replacement, 1)

          path.write_text(text)
          PY

      - name: Commit patched modal and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/AdminDailyChallengeModal.jsx .github/workflows/patch-ai-authoring.yml
          git rm .github/workflows/patch-ai-authoring.yml
          git commit -m "feat: add AI test case and hint controls [skip ci]"
          git push
